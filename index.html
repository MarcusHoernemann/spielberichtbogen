<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DC NBV2 Spielbericht</title>

    <!-- PWA & Homescreen Icons -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DC Issso">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- html2pdf.js für den PDF-Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!--########## CSS Design ##########-->    

    <style>
        :root {
            --primary: #85c1e9;
            --secondary: #7f8c8d;
            --accent: #3498db;
            --bg: #121212;
            --container-bg: #1e1e1e;
            --text: #e0e0e0;
            --border: #444;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --input-bg: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        h1, h2, h3 {
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 5px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: var(--secondary);
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px; 
            background-color: var(--input-bg);
            color: var(--text);
            transition: border-color 0.3s;
            box-sizing: border-box;
            width: 100%;
        }

        select option {
            background-color: var(--input-bg);
            color: var(--text);
        }

        input[readonly] {
            background-color: #222;
            color: #7f8fa6;
            cursor: not-allowed;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .player-grid {
            display: grid;
            grid-template-columns: 90px 1fr 1fr;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
        }

        .player-grid div {
            font-size: 0.9em;
        }

        .ersatz-bg {
            background-color: #111111 !important; 
            color: #888888 !important;
            border: 1px dashed #555555 !important;
        }

        .block-container {
            border: 2px solid var(--border);
            border-radius: 8px;
            margin-bottom: 25px;
            overflow: hidden;
            background: var(--container-bg);
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .block-title {
            background-color: #2c3e50;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .match-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 1fr;
            gap: 10px;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
        }

        .match-row:nth-child(even) {
            background-color: #252525;
        }

        .match-header {
            font-weight: bold;
            background-color: #1f2d3d;
            color: white;
        }

        .dynamic-player {
            font-weight: bold;
            color: var(--accent);
        }

        .player-name-display {
            font-size: 0.5em; 
            font-weight: normal; 
            margin-left: 4px;
            color: var(--secondary);
            vertical-align: middle;
        }

        .set-controls {
            display: inline-flex;
            gap: 8px;
            vertical-align: middle;
        }

        .set-box {
            width: 30px;
            height: 30px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background-color: var(--input-bg);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .set-box.active {
            background-color: #2ecc71;
            border-color: #27ae60;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .sub-row {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
            background-color: #1a252f;
        }

        .sub-group {
            display: flex;
            flex-direction: column;
        }

        .sub-group label {
            font-size: 0.85em;
            margin-bottom: 5px;
            color: var(--primary);
            font-weight: bold;
        }
        
        .sub-twin-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .compact-sub {
            display: flex;
            align-items: center;
            background: var(--container-bg);
            padding: 2px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .compact-sub select {
            padding: 6px;
            font-size: 14px;
            border: none;
            background: transparent;
            color: var(--text);
            width: 100%;
            margin: 0;
            box-shadow: none;
        }

        .compact-sub select:focus {
            outline: none;
            box-shadow: none;
        }

        .compact-sub span {
            font-size: 12px;
            padding: 0 4px;
            color: var(--secondary);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button.action-btn {
            padding: 14px 20px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: background-color 0.3s, opacity 0.2s;
            flex: 1;
        }

        button.submit-btn {
            background-color: var(--accent);
            color: white;
        }

        button.submit-btn:hover {
            background-color: #2980b9;
        }

        button.submit-btn:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        button.reset-btn {
            background-color: var(--danger);
            color: white;
        }

        button.reset-btn:hover {
            background-color: var(--danger-hover);
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .success { background-color: #1e4620; color: #81c784; }
        .error { background-color: #4a1c1e; color: #e57373; }

        .settings-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-start;
            background-color: #252525; 
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            font-size: 10px; 
            color: var(--text); 
        }

        .settings-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-group label {
            margin-bottom: 0;
            color: var(--text); 
            font-weight: normal;
            font-size: 10px; 
        }

        .settings-group .radio-label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .settings-group input[type="radio"] {
            width: auto;
            margin: 0;
            transform: scale(0.8);
        }

        .result-container {
            background: #252525;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .result-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-weight: 600;
            min-width: 130px;
            color: var(--primary);
        }

        .result-row label {
            margin-bottom: 0;
            font-size: 0.9em;
            color: var(--secondary);
        }

        .result-row input {
            width: 60px;
            padding: 6px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
        }

        .copyright {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            font-size: 0.85em;
            color: var(--secondary);
            border-top: 1px solid var(--border);
        }

        /* -------------------------------------------------------------
           PDF-Export-Stile (Blöcke ungeteilt, klare Seitenaufteilung)
        ------------------------------------------------------------- */
        .pdf-section {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .pdf-page-break {
            page-break-before: always !important;
            break-before: page !important;
        }

        .pdf-export-mode {
            background-color: #ffffff !important;
            color: #000000 !important;
            padding: 10px !important;
            margin: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
            font-size: 11px !important;
            line-height: 1.35 !important;
        }

        .pdf-export-mode h1 {
            font-size: 19px !important;
            margin: 0 0 8px 0 !important;
            padding-bottom: 3px !important;
            color: #1a252f !important;
            border-bottom: 2px solid #2c3e50 !important;
            text-align: center !important;
        }

        .pdf-export-mode h2 {
            font-size: 13px !important;
            margin: 10px 0 5px 0 !important;
            padding-bottom: 2px !important;
            color: #2c3e50 !important;
            border-bottom: 1.5px solid #bdc3c7 !important;
        }

        .pdf-export-mode .settings-bar {
            display: none !important;
        }

        .pdf-export-mode .grid-4 {
            display: grid !important;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 10px !important;
            margin-bottom: 8px !important;
        }

        .pdf-export-mode .grid-2 {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 12px !important;
            margin-bottom: 8px !important;
        }

        .pdf-export-mode .form-group {
            margin-bottom: 5px !important;
        }

        .pdf-export-mode label {
            font-size: 9px !important;
            margin-bottom: 2px !important;
            color: #333 !important;
            font-weight: bold !important;
        }

        .pdf-export-mode input[type="text"],
        .pdf-export-mode input[type="number"],
        .pdf-export-mode input[type="date"],
        .pdf-export-mode textarea,
        .pdf-export-mode select {
            padding: 4px 6px !important;
            font-size: 10.5px !important;
            background-color: #fff !important;
            color: #000 !important;
            border: 1px solid #888 !important;
            border-radius: 4px !important;
            height: 26px !important;
            box-sizing: border-box !important;
        }

        .pdf-export-mode textarea {
            height: 50px !important;
        }

        .pdf-export-mode .player-grid {
            grid-template-columns: 75px 1fr 1fr !important;
            gap: 5px !important;
            margin-top: 5px !important;
        }

        .pdf-export-mode .player-grid div {
            font-size: 10px !important;
        }

        .pdf-export-mode .ersatz-bg {
            background-color: #f7f9fa !important;
            color: #000 !important;
            border: 1px dashed #aaa !important;
        }

        .pdf-export-mode .block-container {
            border: 1.5px solid #7f8c8d !important;
            border-radius: 6px !important;
            margin-bottom: 12px !important;
            background: #fff !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        .pdf-export-mode .block-title {
            background-color: #2c3e50 !important;
            color: #ffffff !important;
            padding: 5px 10px !important;
            font-size: 11.5px !important;
            font-weight: bold !important;
        }

        /* Feste, überschneidungsfreie Spaltenbreiten für den Match-Table */
        .pdf-export-mode .match-row {
            display: grid !important;
            grid-template-columns: 65px 1fr 1fr 90px 90px !important;
            gap: 10px !important;
            padding: 5px 10px !important;
            border-bottom: 1px solid #e0e0e0 !important;
            align-items: center !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        .pdf-export-mode .match-row:nth-child(even) {
            background-color: #f9fbfd !important;
        }

        .pdf-export-mode .match-header {
            background-color: #34495e !important;
            color: #ffffff !important;
            font-size: 10.5px !important;
            padding: 5px 10px !important;
        }

        .pdf-export-mode .dynamic-player {
            color: #1a252f !important;
            font-size: 10.5px !important;
            font-weight: bold !important;
        }

        .pdf-export-mode .player-name-display {
            font-size: 9px !important;
            color: #555 !important;
            margin-left: 4px !important;
        }

        .pdf-export-mode .set-controls {
            gap: 5px !important;
        }

        .pdf-export-mode .set-box {
            width: 17px !important;
            height: 17px !important;
            border: 1.5px solid #666 !important;
            border-radius: 3px !important;
            background-color: #ffffff !important;
        }

        .pdf-export-mode .set-box.active {
            background-color: #27ae60 !important;
            border-color: #1e8449 !important;
        }

        .pdf-export-mode .sub-row {
            padding: 6px 10px !important;
            gap: 5px !important;
            background-color: #f4f6f7 !important;
            border-top: 1px dashed #bdc3c7 !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        .pdf-export-mode .sub-twin-container {
            gap: 6px !important;
        }

        .pdf-export-mode .compact-sub {
            padding: 2px 4px !important;
            border: 1px solid #ccc !important;
            background: #fff !important;
            border-radius: 4px !important;
        }

        .pdf-export-mode .compact-sub select {
            padding: 2px 4px !important;
            font-size: 9.5px !important;
            height: 22px !important;
        }

        .pdf-export-mode .compact-sub span {
            font-size: 9.5px !important;
            padding: 0 3px !important;
        }

        .pdf-export-mode .result-container {
            background: #f8f9fa !important;
            padding: 8px 12px !important;
            border: 1.5px solid #bdc3c7 !important;
            border-radius: 6px !important;
            margin-bottom: 10px !important;
        }

        .pdf-export-mode .result-row {
            gap: 10px !important;
            margin-bottom: 5px !important;
        }

        .pdf-export-mode .result-label {
            min-width: 120px !important;
            font-size: 11px !important;
            color: #2c3e50 !important;
        }

        .pdf-export-mode .result-row label {
            font-size: 10.5px !important;
            color: #333 !important;
        }

        .pdf-export-mode .result-row input {
            width: 45px !important;
            height: 24px !important;
            font-size: 11.5px !important;
            padding: 2px !important;
            border: 1px solid #7f8c8d !important;
            background-color: #fff !important;
            color: #000 !important;
        }

        .pdf-export-mode .copyright {
            margin-top: 8px !important;
            padding-top: 5px !important;
            font-size: 8.5px !important;
            color: #7f8c8d !important;
            border-top: 1px solid #ddd !important;
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .match-row {
                grid-template-columns: 1fr;
                gap: 5px;
                padding: 15px 10px;
            }
            .match-header {
                display: none;
            }
            .mobile-label {
                display: inline-block;
                width: 90px;
                font-weight: bold;
            }
            .result-row {
                flex-wrap: wrap;
            }
            .result-label {
                width: 100%;
                margin-bottom: 5px;
            }
            .sub-twin-container {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            }
            .settings-bar {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container" id="reportContent">
    
    <!-- SEITE 1: Kopfdaten, Aufstellung & Block 1 -->
    <div id="pdfPage1" class="pdf-section">
        <h1>DC NBV 2 Spielbericht</h1>
        
        <form id="dartForm">
            
            <div class="settings-bar">
                <div class="settings-group">
                    <label>Mannschaft:</label>
                    <label class="radio-label"><input type="radio" name="teamRolle" value="Heim" checked> Heim</label>
                    <label class="radio-label"><input type="radio" name="teamRolle" value="Gast"> Gast</label>
                </div>
            </div>

            <div class="grid-4">
                <div class="form-group">
                    <label>Datum</label>
                    <input type="date" id="datum" required>
                </div>
                <div class="form-group">
                    <label>Liga-Gruppe</label>
                    <input type="text" id="liga">
                </div>
                <div class="form-group">
                    <label>Spielnr.</label>
                    <input type="text" id="spielnr">
                </div>
                <div class="form-group">
                    <label>Disziplin</label>
                    <select id="disziplin">
                        <option value="301 Single out">301 Single out</option>
                        <option value="301 Master out">301 Master out</option>
                        <option value="501 Master out">501 Master out</option>
                        <option value="501 Double out">501 Double out</option>
                    </select>
                </div>
            </div>

<!--########## Mannschaftsaufstellung ##########-->

            <h2>Mannschaftsaufstellung</h2>
            <div class="grid-2">
                <div>
                    <div class="form-group">
                        <label>Heim-Team (Teamname)</label>
                        <input type="text" id="heimTeam" required>
                    </div>
                    <div class="form-group">
                        <label>Teamkapitän (Heim)</label>
                        <div id="kapitaenHeimContainer"><input type="text" id="kapitaenHeim"></div>
                    </div>
                    <div class="player-grid" id="heimRoster">
                        <!-- Dynamisch befüllt -->
                    </div>
                </div>

                <div>
                    <div class="form-group">
                        <label>Gast-Team (Teamname)</label>
                        <input type="text" id="gastTeam" required>
                    </div>
                    <div class="form-group">
                        <label>Teamkapitän (Gast)</label>
                        <div id="kapitaenGastContainer"><input type="text" id="kapitaenGast"></div>
                    </div>
                    <div class="player-grid" id="gastRoster">
                        <!-- Dynamisch befüllt -->
                    </div>
                </div>
            </div>

<!--########## Block 1 ##########-->
            <h2>Spielplan - Block 1</h2>
            <div id="blockContainer1" class="pdf-section"></div>
    </div>

    <!-- SEITE 2: Block 2 & Block 3 -->
    <div id="pdfPage2" class="pdf-section">
        <h2>Spielplan - Block 2 & 3</h2>
        <div id="blockContainer2" class="pdf-section"></div>
        <div id="blockContainer3" class="pdf-section"></div>
    </div>

    <!-- SEITE 3: Block 4, Endergebnis, Bestleistungen & Bemerkungen -->
    <div id="pdfPage3" class="pdf-section">
        <h2>Spielplan - Block 4</h2>
        <div id="blockContainer4" class="pdf-section"></div>

<!--########## Endergebnis & Gewinnsätze ##########-->

        <h2>Endergebnis & Gewinnsätze</h2>
        <div class="result-container pdf-section">
            <div class="result-row">
                <span class="result-label">Spielergebnis:</span>
                <label>Heim</label> <input type="number" id="spielergebnisHeim" readonly placeholder="0">
                <label>Gast</label> <input type="number" id="spielergebnisGast" readonly placeholder="0">
            </div>
            <div class="result-row">
                <span class="result-label">Gewinnsätze:</span>
                <label>Heim</label> <input type="number" id="gewinnsaetzeHeim" readonly placeholder="0">
                <label>Gast</label> <input type="number" id="gewinnsaetzeGast" readonly placeholder="0">
            </div>
        </div>

<!--########## Bestleistungen ##########-->

        <h2>Bestleistungen</h2>
        <div class="grid-4 pdf-section">
            <div class="form-group">
                <label>High Score (180, 171, ...)</label>
                <input type="text" id="highScore">
            </div>
            <div class="form-group">
                <label>High Finish (ab 100)</label>
                <input type="text" id="highFinish">
            </div>
            <div class="form-group">
                <label>Short Game</label>
                <input type="text" id="shortGame">
            </div>
            <div class="form-group">
                <label>Bull Eye Check</label>
                <input type="text" id="bullEye">
            </div>
        </div>

<!--########## Bemerkungen ##########-->

        <h2>Bemerkungen</h2>
        <div class="form-group pdf-section">
            <textarea id="bemerkungen" rows="3"></textarea>
        </div>

        <div class="button-group" id="formActions">
            <button type="submit" id="submitBtn" class="action-btn submit-btn">Als PDF exportieren</button>
            <button type="button" id="resetBtn" class="action-btn reset-btn">Neuer Spieltag (Zurücksetzen)</button>
        </div>
        <div id="statusMessage" class="status-msg"></div>
        </form>

    </div>
</div>

<script>
// ###############################################################################################
// ######################################## KONFIGURATION ########################################
// ###############################################################################################
    
    // --- Vereinsname ---
    const MEIN_VEREIN = "DC NBV 2";
    // --- Spielernamen ---
    const unsereSpieler = [
        "Gerd", "Christian", "Tanja", "Marcus", "Rene",
        "Britta", "Thorsten", "Olli", "Spieler 9", "Spieler 10"
    ];
    // --- Namen erster und zweiter TC ---
    const unsereKapitaene = ["Gerd", "Tanja"];

    // --- Dynamische Roster- & Kapitän-Generierung ---
    function buildCaptain(prefix, isIsso) {
        const container = document.getElementById(prefix === 'h' ? 'kapitaenHeimContainer' : 'kapitaenGastContainer');
        const oldInput = document.getElementById(prefix === 'h' ? 'kapitaenHeim' : 'kapitaenGast');
        const oldVal = oldInput ? oldInput.value : '';

        if (isIsso) {
            let options = `<option value="">Bitte wählen...</option>`;
            unsereKapitaene.forEach(k => {
                let selected = (oldVal === k) ? 'selected' : '';
                options += `<option value="${k}" ${selected}>${k}</option>`;
            });
            container.innerHTML = `<select id="${prefix === 'h' ? 'kapitaenHeim' : 'kapitaenGast'}">${options}</select>`;
        } else {
            container.innerHTML = `<input type="text" id="${prefix === 'h' ? 'kapitaenHeim' : 'kapitaenGast'}" value="${oldVal}">`;
        }
    }

    function buildRoster(prefix, isIsso) {
        const roster = document.getElementById(prefix === 'h' ? 'heimRoster' : 'gastRoster');
        
        const oldNames = {};
        const oldPasses = {};
        for(let i = 1; i <= 6; i++) {
            let el = document.querySelector(`.player-name-${prefix}[data-idx="${i}"]`);
            if(el) oldNames[i] = el.value;
            let passEl = document.querySelector(`.player-pass-${prefix}[data-idx="${i}"]`);
            if(passEl) oldPasses[i] = passEl.value;
        }

        roster.innerHTML = `<div><strong>Pos.</strong></div><div><strong>Spielername</strong></div><div><strong>Passnr.</strong></div>`;

        for (let i = 1; i <= 6; i++) {
            const label = i > 4 ? `${prefix.toUpperCase()}${i} (Ersatz)` : `${prefix.toUpperCase()}${i}`;
            const bgClass = i > 4 ? 'ersatz-bg' : '';

            let nameInput = '';
            if (isIsso) {
                let options = `<option value="">Bitte wählen...</option>`;
                unsereSpieler.forEach(sp => {
                    let selected = (oldNames[i] === sp) ? 'selected' : '';
                    options += `<option value="${sp}" ${selected}>${sp}</option>`;
                });
                nameInput = `<select class="player-name-${prefix} ${bgClass}" data-idx="${i}">${options}</select>`;
            } else {
                let val = oldNames[i] || '';
                nameInput = `<input type="text" class="player-name-${prefix} ${bgClass}" data-idx="${i}" value="${val}">`;
            }

            let passVal = oldPasses[i] || '';
            let passInput = `<input type="text" class="player-pass-${prefix} ${bgClass}" data-idx="${i}" value="${passVal}">`;

            roster.innerHTML += `
                <div><strong>${label}</strong></div>
                <div>${nameInput}</div>
                <div>${passInput}</div>
            `;
        }
    }

    const basePairings = [
        [1,1], [2,2], [3,3], [4,4], // Block 1
        [1,2], [2,4], [3,1], [4,3], // Block 2
        [1,3], [2,1], [3,4], [4,2], // Block 3
        [1,4], [2,3], [3,2], [4,1]  // Block 4
    ];

    let currentBlock = null;

    basePairings.forEach((paarung, index) => {
        const gameNr = index + 1;
        const blockNr = Math.ceil(gameNr / 4);
        const blockTarget = document.getElementById(`blockContainer${blockNr}`);

        if (gameNr % 4 === 1) {
            currentBlock = document.createElement('div');
            currentBlock.className = 'block-container';
            currentBlock.innerHTML = `
                <div class="block-title">Block ${blockNr}</div>
                <div class="match-row match-header">
                    <div>Spiel</div>
                    <div>Heim</div>
                    <div>Gast</div>
                    <div>Sätze Heim</div>
                    <div>Sätze Gast</div>
                </div>
            `;
            blockTarget.appendChild(currentBlock);
        }

        const row = document.createElement('div');
        row.className = 'match-row';
        row.innerHTML = `
            <div><strong>#${gameNr}</strong></div>
            <div><span class="mobile-label">Heim:</span> <span id="label-heim-${gameNr}" class="dynamic-player">H${paarung[0]}</span></div>
            <div><span class="mobile-label">Gast:</span> <span id="label-gast-${gameNr}" class="dynamic-player">G${paarung[1]}</span></div>
            <div>
                <span class="mobile-label">Sätze H:</span>
                <div class="set-controls" id="heim-sets-${gameNr}">
                    <div class="set-box"></div>
                    <div class="set-box"></div>
                </div>
            </div>
            <div>
                <span class="mobile-label">Sätze G:</span>
                <div class="set-controls" id="gast-sets-${gameNr}">
                    <div class="set-box"></div>
                    <div class="set-box"></div>
                </div>
            </div>
        `;
        currentBlock.appendChild(row);

        if (gameNr % 4 === 0 && blockNr < 4) {
            const subRow = document.createElement('div');
            subRow.className = 'sub-row';
            subRow.innerHTML = `
                <div class="sub-group">
                    <label>Wechsel Heim nach Block ${blockNr}</label>
                    <div class="sub-twin-container">
                        <div class="compact-sub">
                            <select class="sub-heim-out-1 sub-trigger" data-block="${blockNr}">
                                <option value="">Raus</option>
                                <option value="1">H1</option>
                                <option value="2">H2</option>
                                <option value="3">H3</option>
                                <option value="4">H4</option>
                            </select>
                            <span>➡️</span>
                            <select class="sub-heim-in-1 sub-trigger" data-block="${blockNr}">
                                <option value="">Rein</option>
                                <option value="H5">H5</option>
                                <option value="H6">H6</option>
                            </select>
                        </div>
                        <div class="compact-sub">
                            <select class="sub-heim-out-2 sub-trigger" data-block="${blockNr}">
                                <option value="">Raus</option>
                                <option value="1">H1</option>
                                <option value="2">H2</option>
                                <option value="3">H3</option>
                                <option value="4">H4</option>
                            </select>
                            <span>➡️</span>
                            <select class="sub-heim-in-2 sub-trigger" data-block="${blockNr}">
                                <option value="">Rein</option>
                                <option value="H5">H5</option>
                                <option value="H6">H6</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="sub-group">
                    <label>Wechsel Gast nach Block ${blockNr}</label>
                    <div class="sub-twin-container">
                        <div class="compact-sub">
                            <select class="sub-gast-out-1 sub-trigger" data-block="${blockNr}">
                                <option value="">Raus</option>
                                <option value="1">G1</option>
                                <option value="2">G2</option>
                                <option value="3">G3</option>
                                <option value="4">G4</option>
                            </select>
                            <span>➡️</span>
                            <select class="sub-gast-in-1 sub-trigger" data-block="${blockNr}">
                                <option value="">Rein</option>
                                <option value="G5">G5</option>
                                <option value="G6">G6</option>
                            </select>
                        </div>
                        <div class="compact-sub">
                            <select class="sub-gast-out-2 sub-trigger" data-block="${blockNr}">
                                <option value="">Raus</option>
                                <option value="1">G1</option>
                                <option value="2">G2</option>
                                <option value="3">G3</option>
                                <option value="4">G4</option>
                            </select>
                            <span>➡️</span>
                            <select class="sub-gast-in-2 sub-trigger" data-block="${blockNr}">
                                <option value="">Rein</option>
                                <option value="G5">G5</option>
                                <option value="G6">G6</option>
                            </select>
                        </div>
                    </div>
                </div>
            `;
            currentBlock.appendChild(subRow);
        }
    });

    function calculateTotals() {
        let totalHeimSets = 0;
        let totalGastSets = 0;
        let totalHeimGames = 0;
        let totalGastGames = 0;
        
        for(let i = 1; i <= 16; i++) {
            let heimSets = document.querySelectorAll(`#heim-sets-${i} .set-box.active`).length;
            let gastSets = document.querySelectorAll(`#gast-sets-${i} .set-box.active`).length;
            
            totalHeimSets += heimSets;
            totalGastSets += gastSets;
            
            if (heimSets === 2) totalHeimGames++;
            if (gastSets === 2) totalGastGames++;
        }
        
        document.getElementById('gewinnsaetzeHeim').value = totalHeimSets;
        document.getElementById('gewinnsaetzeGast').value = totalGastSets;
        document.getElementById('spielergebnisHeim').value = totalHeimGames;
        document.getElementById('spielergebnisGast').value = totalGastGames;
    }

    document.querySelectorAll('[id^="blockContainer"]').forEach(container => {
        container.addEventListener('click', function(e) {
            if (e.target.classList.contains('set-box')) {
                e.target.classList.toggle('active');
                calculateTotals();
            }
        });
    });

    function updateMatches() {
        let heimSlots = { 1: 'H1', 2: 'H2', 3: 'H3', 4: 'H4' };
        let gastSlots = { 1: 'G1', 2: 'G2', 3: 'G3', 4: 'G4' };

        for (let b = 1; b <= 4; b++) {
            let startIndex = (b - 1) * 4;
            if (b > 1) { 
                let prevBlock = b - 1;
                
                let hOut1 = document.querySelector(`.sub-heim-out-1[data-block="${prevBlock}"]`).value;
                let hIn1 = document.querySelector(`.sub-heim-in-1[data-block="${prevBlock}"]`).value;
                if (hOut1 && hIn1) heimSlots[parseInt(hOut1)] = hIn1;
                
                let hOut2 = document.querySelector(`.sub-heim-out-2[data-block="${prevBlock}"]`).value;
                let hIn2 = document.querySelector(`.sub-heim-in-2[data-block="${prevBlock}"]`).value;
                if (hOut2 && hIn2) heimSlots[parseInt(hOut2)] = hIn2;

                let gOut1 = document.querySelector(`.sub-gast-out-1[data-block="${prevBlock}"]`).value;
                let gIn1 = document.querySelector(`.sub-gast-in-1[data-block="${prevBlock}"]`).value;
                if (gOut1 && gIn1) gastSlots[parseInt(gOut1)] = gIn1;
                
                let gOut2 = document.querySelector(`.sub-gast-out-2[data-block="${prevBlock}"]`).value;
                let gIn2 = document.querySelector(`.sub-gast-in-2[data-block="${prevBlock}"]`).value;
                if (gOut2 && gIn2) gastSlots[parseInt(gOut2)] = gIn2;
            }

            for(let i = 0; i < 4; i++) {
                let gameIdx = startIndex + i;
                let hSlot = basePairings[gameIdx][0]; 
                let gSlot = basePairings[gameIdx][1]; 
                
                let currentH = heimSlots[hSlot]; 
                let currentG = gastSlots[gSlot]; 

                let hIndex = currentH.substring(1);
                let gIndex = currentG.substring(1);

                let hInput = document.querySelector(`.player-name-h[data-idx="${hIndex}"]`);
                let gInput = document.querySelector(`.player-name-g[data-idx="${gIndex}"]`);

                let hName = hInput ? hInput.value.trim() : '';
                let gName = gInput ? gInput.value.trim() : '';

                let hNameDisplay = hName ? `<span class="player-name-display">(${hName})</span>` : '';
                let gNameDisplay = gName ? `<span class="player-name-display">(${gName})</span>` : '';

                document.getElementById(`label-heim-${gameIdx+1}`).innerHTML = `${currentH} ${hNameDisplay}`;
                document.getElementById(`label-gast-${gameIdx+1}`).innerHTML = `${currentG} ${gNameDisplay}`;
            }
        }
    }

    ['heimRoster', 'gastRoster'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('change', function(e) {
            if(e.target.classList.contains('player-name-h') || e.target.classList.contains('player-name-g')) updateMatches();
        });
        el.addEventListener('input', function(e) {
            if(e.target.classList.contains('player-name-h') || e.target.classList.contains('player-name-g')) updateMatches();
        });
    });

    document.querySelectorAll('.sub-trigger').forEach(select => {
        select.addEventListener('change', updateMatches);
    });

    const heimTeamInput = document.getElementById('heimTeam');
    const gastTeamInput = document.getElementById('gastTeam');

    function updateTeamNameAuto() {
        const isHeim = document.querySelector('input[name="teamRolle"]:checked').value === 'Heim';
        if (isHeim) {
            heimTeamInput.value = MEIN_VEREIN;
            if (gastTeamInput.value === MEIN_VEREIN) gastTeamInput.value = '';
            buildCaptain('h', true);
            buildCaptain('g', false);
            buildRoster('h', true);
            buildRoster('g', false);
        } else {
            gastTeamInput.value = MEIN_VEREIN;
            if (heimTeamInput.value === MEIN_VEREIN) heimTeamInput.value = '';
            buildCaptain('h', false);
            buildCaptain('g', true);
            buildRoster('h', false);
            buildRoster('g', true);
        }
        updateMatches();
    }

    document.querySelectorAll('input[name="teamRolle"]').forEach(radio => {
        radio.addEventListener('change', updateTeamNameAuto);
    });

    function resetFormComplete() {
        document.getElementById('dartForm').reset();
        
        const heimRadio = document.querySelector('input[name="teamRolle"][value="Heim"]');
        if (heimRadio) heimRadio.checked = true;
        
        document.querySelectorAll('.sub-trigger').forEach(select => {
            select.value = "";
        });

        document.querySelectorAll('.set-box.active').forEach(box => {
            box.classList.remove('active');
        });

        updateTeamNameAuto();
        calculateTotals();

        const statusMsg = document.getElementById('statusMessage');
        statusMsg.style.display = 'none';
        statusMsg.textContent = '';
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm('Möchtest du das gesamte Formular für einen neuen Spieltag leeren?')) {
            resetFormComplete();
        }
    });

    // Initiales Setup
    updateTeamNameAuto();

    // --- Formular absenden & PDF-Export (3-Seiten-Struktur ohne Block-Zerteilung) ---
    document.getElementById('dartForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const formActions = document.getElementById('formActions');
        const statusMsg = document.getElementById('statusMessage');
        const reportContainer = document.getElementById('reportContent');
        const page2 = document.getElementById('pdfPage2');
        const page3 = document.getElementById('pdfPage3');
        
        submitBtn.disabled = true;
        resetBtn.disabled = true;
        submitBtn.textContent = 'Erstelle PDF...';
        statusMsg.style.display = 'none';

        try {
            const datum = document.getElementById('datum').value || 'Datum';
            const heim = document.getElementById('heimTeam').value || 'Heim';
            const gast = document.getElementById('gastTeam').value || 'Gast';
            const fileName = `Spielbericht_${datum}_${heim}_vs_${gast}.pdf`.replace(/[^a-zA-Z0-9_\-\.]/g, '_');

            // Feste Seitenumbrüche vor Seite 2 und Seite 3 setzen
            reportContainer.classList.add('pdf-export-mode');
            page2.classList.add('pdf-page-break');
            page3.classList.add('pdf-page-break');
            formActions.style.display = 'none';

            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     fileName,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['css', 'legacy'] }
            };

            await html2pdf().set(opt).from(reportContainer).save();

            // Modus zurücksetzen
            reportContainer.classList.remove('pdf-export-mode');
            page2.classList.remove('pdf-page-break');
            page3.classList.remove('pdf-page-break');
            formActions.style.display = 'flex';

            statusMsg.textContent = 'PDF erfolgreich erstellt und heruntergeladen!';
            statusMsg.className = 'status-msg success';
            statusMsg.style.display = 'block';

        } catch (error) {
            reportContainer.classList.remove('pdf-export-mode');
            page2.classList.remove('pdf-page-break');
            page3.classList.remove('pdf-page-break');
            formActions.style.display = 'flex';

            statusMsg.textContent = 'Fehler beim PDF-Export: ' + error.message;
            statusMsg.className = 'status-msg error';
            statusMsg.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            resetBtn.disabled = false;
            submitBtn.textContent = 'Als PDF exportieren';
        }
    });
</script>
</body>
</html>
